# Container platforms may set PORT; local/Compose default remains 8080.
server.port=${PORT:8080}
spring.application.name=keynest-manager-api
keynest.notifications.scan-enabled=${KEYNEST_NOTIFICATIONS_SCAN_ENABLED:false}
keynest.notifications.dispatch-enabled=${KEYNEST_NOTIFICATIONS_DISPATCH_ENABLED:false}

# Optional BYOK backend: no provider call without authenticated, explicit invocation.
keynest.ai.enabled=${KEYNEST_AI_ENABLED:false}
# No implicit model selection; operator reviews a Responses/JSON-schema-capable model.
keynest.ai.openai-model=${KEYNEST_AI_OPENAI_MODEL:}

# Portable, status-only probes. Diagnostic endpoints require a separately reviewed design.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Local default: in-memory H2. Use profile `docker` for Postgres (Compose / Railway).
spring.datasource.url=jdbc:h2:mem:keynest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true

# MVP server-side vault key (32-byte hex). Replace in real deploys.
keynest.vault.key-hex=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
keynest.vault.key-id=vault-v1
keynest.vault.allow-demo-key=true

# Browser origins for /api/** (comma-separated). Override with KEYNEST_CORS_ALLOWED_ORIGINS.
keynest.cors.allowed-origins=http://localhost:4200

# Local/dev tools demo seal/open (off in docker/prod — see application-docker.properties).
keynest.tools.demo.enabled=true
keynest.tools.demo.key-hex=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
keynest.tools.demo.key-id=demo-kid

# Rate-limit tools validate + auth register/login (#17). See README for self-host overrides.
keynest.rate-limit.enabled=true
keynest.rate-limit.limit=${KEYNEST_RATE_LIMIT_LIMIT:30}
keynest.rate-limit.window-seconds=${KEYNEST_RATE_LIMIT_WINDOW_SECONDS:60}
keynest.rate-limit.max-entries=${KEYNEST_RATE_LIMIT_MAX_ENTRIES:10000}
keynest.rate-limit.max-forwarded-for-entries=${KEYNEST_RATE_LIMIT_MAX_FORWARDED_FOR_ENTRIES:16}
# Empty by default: forwarding headers are ignored unless the direct proxy IP/CIDR is explicitly trusted.
keynest.rate-limit.trusted-proxies=${KEYNEST_RATE_LIMIT_TRUSTED_PROXIES:}
