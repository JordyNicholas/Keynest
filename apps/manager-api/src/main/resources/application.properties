# Container platforms may set PORT; local/Compose default remains 8080.
server.port=${PORT:8080}
spring.application.name=keynest-manager-api

# Local default: in-memory H2. Use profile `docker` for Postgres (Compose / Railway).
spring.datasource.url=jdbc:h2:mem:keynest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# MVP server-side vault key (32-byte hex). Replace in real deploys.
keynest.vault.key-hex=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
keynest.vault.key-id=vault-v1

# Browser origins for /api/** (comma-separated). Override with KEYNEST_CORS_ALLOWED_ORIGINS.
keynest.cors.allowed-origins=http://localhost:4200
