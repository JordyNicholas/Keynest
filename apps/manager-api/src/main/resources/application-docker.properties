spring.config.activate.on-profile=docker

# Prefer a full JDBC URL when using managed Postgres (e.g. Railway). Falls back to Compose host pieces.
spring.datasource.url=${KEYNEST_JDBC_URL:jdbc:postgresql://${KEYNEST_DB_HOST:postgres}:${KEYNEST_DB_PORT:5432}/${KEYNEST_DB_NAME:keynest}}
spring.datasource.username=${KEYNEST_DB_USER:keynest}
spring.datasource.password=${KEYNEST_DB_PASSWORD:keynest}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

keynest.vault.key-hex=${KEYNEST_VAULT_KEY_HEX:}
keynest.vault.key-id=${KEYNEST_VAULT_KEY_ID:vault-v1}
keynest.vault.allow-demo-key=${KEYNEST_ALLOW_DEMO_VAULT_KEY:false}

keynest.cors.allowed-origins=${KEYNEST_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Tools demo seal/open off by default; no demo key shipped in this profile.
keynest.tools.demo.enabled=${KEYNEST_TOOLS_DEMO_ENABLED:false}

# Rate-limit tools validate + auth register/login (on by default for self-host).
keynest.rate-limit.enabled=${KEYNEST_RATE_LIMIT_ENABLED:true}
keynest.rate-limit.limit=${KEYNEST_RATE_LIMIT_LIMIT:30}
keynest.rate-limit.window-seconds=${KEYNEST_RATE_LIMIT_WINDOW_SECONDS:60}
keynest.rate-limit.max-entries=${KEYNEST_RATE_LIMIT_MAX_ENTRIES:10000}
keynest.rate-limit.max-forwarded-for-entries=${KEYNEST_RATE_LIMIT_MAX_FORWARDED_FOR_ENTRIES:16}
keynest.rate-limit.trusted-proxies=${KEYNEST_RATE_LIMIT_TRUSTED_PROXIES:}
