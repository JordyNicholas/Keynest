spring.config.activate.on-profile=docker

spring.datasource.url=jdbc:postgresql://${KEYNEST_DB_HOST:postgres}:${KEYNEST_DB_PORT:5432}/${KEYNEST_DB_NAME:keynest}
spring.datasource.username=${KEYNEST_DB_USER:keynest}
spring.datasource.password=${KEYNEST_DB_PASSWORD:keynest}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

keynest.vault.key-hex=${KEYNEST_VAULT_KEY_HEX:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
keynest.vault.key-id=${KEYNEST_VAULT_KEY_ID:vault-v1}
