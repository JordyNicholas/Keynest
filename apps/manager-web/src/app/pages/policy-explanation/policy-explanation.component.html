<form (submit)="explain($event, providerKey)">
  <p id="provider-disclosure">OpenAI receives selected built-in policy rules and instructions to explain them. Your API key is used once, and provider charges may apply.</p>
  <label for="provider-key">OpenAI API key</label>
  <input #providerKey id="provider-key" type="password" autocomplete="off" aria-describedby="provider-disclosure"
    spellcheck="false" maxlength="4096" required [disabled]="pending()" />
  <div class="row">
    <button mat-flat-button type="submit" [disabled]="pending()">Explain with OpenAI</button>
    @if (pending()) {
      <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
    }
  </div>
  @if (pending()) {
    <p role="status">Requesting an explanation…</p>
  }
</form>

<kn-inline-error [message]="error()" />
