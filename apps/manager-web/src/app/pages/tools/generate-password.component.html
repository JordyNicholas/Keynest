<h1 class="page-title" id="gen-heading">Generate password</h1>
<kn-inline-error [message]="error()" />

<section class="panel" aria-labelledby="gen-heading">
  <div class="row">
    <button mat-flat-button type="button" [disabled]="generating()" (click)="generate()">Generate password</button>
    @if (generated()) {
      <button mat-stroked-button type="button" (click)="clearGenerated()">Clear</button>
    }
  </div>
  @if (generated()) {
    <output class="secret" animate.enter="kn-enter">
      {{ generated() }}
    </output>
  }
</section>
