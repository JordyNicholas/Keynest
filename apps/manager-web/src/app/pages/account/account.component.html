<h1 class="page-title">Account</h1>
<p class="page-lede">Sign in or create an account to use the vault.</p>

<kn-inline-error [message]="error()" />

<section class="panel" aria-labelledby="auth-heading">
  <h2 id="auth-heading">Session</h2>
  @if (auth.signedIn()) {
    <p>Signed in as <strong>{{ auth.email() }}</strong></p>
    <button mat-stroked-button type="button" (click)="logout()">Sign out</button>
  } @else {
    <label>
      Email
      <input type="email" autocomplete="username" [ngModel]="formEmail()" (ngModelChange)="formEmail.set($event)" />
    </label>
    <label>
      Master password
      <input knPasswordVisibility #passwordVisibility="knPasswordVisibility" autocomplete="current-password" [ngModel]="formPassword()" (ngModelChange)="formPassword.set($event)" />
    </label>
    <div class="row">
      <button type="button" [attr.aria-pressed]="passwordVisibility.visible()" (click)="passwordVisibility.toggle()">Show master password</button>
      <button mat-stroked-button type="button" (click)="passwordVisibility.hide(); register()">Register</button>
      <button mat-flat-button type="button" (click)="passwordVisibility.hide(); login()">Sign in</button>
    </div>
  }
</section>
