<h1 class="page-title">{{ auth.signedIn() ? 'Account settings' : 'Sign in to Manager' }}</h1>
<kn-inline-error [message]="error()" />

@if (auth.signedIn()) {
  <section class="panel" aria-labelledby="auth-heading">
    <h2 id="auth-heading">Profile and session</h2>
    @if (auth.email() && auth.email() !== 'session') {
      <dl class="data-list">
        <dt>Email</dt>
        <dd>{{ auth.email() }}</dd>
      </dl>
    }
    <button mat-stroked-button type="button" (click)="logout()">Sign out</button>
  </section>
} @else {
  <p class="page-lede">Sign in or create an account to use your vault.</p>
  <form class="panel" (ngSubmit)="login()">
    <label>
      Email
      <input type="email" name="email" autocomplete="username" [ngModel]="formEmail()" (ngModelChange)="formEmail.set($event)" />
    </label>
    <label>
      Master password
      <input type="password" name="password" autocomplete="current-password" [ngModel]="formPassword()" (ngModelChange)="formPassword.set($event)" />
    </label>
    <div class="row">
      <button mat-flat-button type="submit">Sign in</button>
      <button mat-stroked-button type="button" (click)="register()">Create account</button>
    </div>
  </form>
}

<section class="panel" aria-labelledby="diagnostics-heading">
  <h2 id="diagnostics-heading">Troubleshooting</h2>
  <a mat-stroked-button routerLink="/status">API health</a>
</section>
