<h2 mat-dialog-title id="change-password-title">Change account password</h2>
<mat-dialog-content>
  <p>Choose a new account password of at least 15 characters. Other sessions will end; this browser will receive a new session. Your saved passwords stay in your Vault.</p>
  <kn-inline-error [(message)]="error" />
  <form id="change-password-form" ngNativeValidate (submit)="submit($event)" [attr.aria-busy]="busy()">
    <label for="change-current-password">Current account password</label>
    <input #current id="change-current-password" [type]="visible() ? 'text' : 'password'" autocomplete="current-password" required maxlength="32768" [disabled]="busy()" />
    <label for="change-new-password">New account password</label>
    <input #next id="change-new-password" [type]="visible() ? 'text' : 'password'" autocomplete="new-password" required minlength="15" maxlength="32768" [disabled]="busy()" />
    <label for="change-confirm-password">Confirm new account password</label>
    <input #confirmation id="change-confirm-password" [type]="visible() ? 'text' : 'password'" autocomplete="new-password" required maxlength="32768" [disabled]="busy()" />
    <button mat-stroked-button type="button" [disabled]="busy()" [attr.aria-pressed]="visible()"
      aria-controls="change-current-password change-new-password change-confirm-password" (click)="visible.set(!visible())">{{ visible() ? 'Hide passwords' : 'Show passwords' }}</button>
    <p role="status">{{ busy() ? 'Changing password…' : '' }}</p>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [disabled]="busy()" mat-dialog-close>Cancel</button>
  <button mat-flat-button type="submit" form="change-password-form" [disabled]="busy()">{{ busy() ? 'Changing…' : 'Verify and change password' }}</button>
</mat-dialog-actions>
