<div class="shell">
  <header class="brand">
    <a class="mark" routerLink="/">Keynest</a>
    <p class="product">Manager</p>
  </header>

  <nav class="nav" aria-label="Primary">
    <a routerLink="/tools" routerLinkActive="active" ariaCurrentWhenActive="page">Password tools</a>
    @if (signedIn()) {
      <a routerLink="/vault" routerLinkActive="active" ariaCurrentWhenActive="page">Vault</a>
    }
    <a routerLink="/account" routerLinkActive="active" ariaCurrentWhenActive="page">{{ signedIn() ? 'Account settings' : 'Sign in' }}</a>
  </nav>

  <main #page class="main">
    <router-outlet (activate)="animatePage(page)" />
  </main>
</div>
