<div class="shell">
  <header class="brand">
    <a class="mark" routerLink="/">Keynest</a>
    <p class="product">Manager</p>
  </header>

  <nav class="nav" aria-label="Primary">
    <a #tools routerLink="/tools" routerLinkActive="active" ariaCurrentWhenActive="page"
       (isActiveChange)="keepActiveLinkVisible(tools, $event)">Password tools</a>
    @if (signedIn()) {
      <a #vault routerLink="/vault" routerLinkActive="active" ariaCurrentWhenActive="page"
       (isActiveChange)="keepActiveLinkVisible(vault, $event)">Vault</a>
    }
    <a #account routerLink="/account" routerLinkActive="active" ariaCurrentWhenActive="page"
       (isActiveChange)="keepActiveLinkVisible(account, $event)">{{ signedIn() ? 'Account settings' : 'Sign in' }}</a>
  </nav>

  <main #page class="main">
    <router-outlet (activate)="animatePage(page)" />
  </main>
</div>
