services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYNEST_DB_NAME:-keynest}
      POSTGRES_USER: ${KEYNEST_DB_USER:-keynest}
      POSTGRES_PASSWORD: ${KEYNEST_DB_PASSWORD:-keynest}
    ports:
      - "5432:5432"
    volumes:
      - keynest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  manager-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      KEYNEST_DB_HOST: ${KEYNEST_DB_HOST:-postgres}
      KEYNEST_DB_PORT: ${KEYNEST_DB_PORT:-5432}
      KEYNEST_DB_NAME: ${KEYNEST_DB_NAME:-keynest}
      KEYNEST_DB_USER: ${KEYNEST_DB_USER:-keynest}
      KEYNEST_DB_PASSWORD: ${KEYNEST_DB_PASSWORD:-keynest}
      KEYNEST_VAULT_KEY_HEX: ${KEYNEST_VAULT_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      KEYNEST_VAULT_KEY_ID: ${KEYNEST_VAULT_KEY_ID:-vault-v1}
      # Comma-separated; include Vercel UI origin when API is public (see docs/ORACLE_ALWAYS_FREE.md)
      KEYNEST_CORS_ALLOWED_ORIGINS: ${KEYNEST_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keynest_pg:
