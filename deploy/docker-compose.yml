services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keynest
      POSTGRES_USER: keynest
      POSTGRES_PASSWORD: keynest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keynest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keynest -d keynest"]
      interval: 5s
      timeout: 5s
      retries: 10

  manager-api:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Native Argon2/JNA loads a shared library from /tmp; do not mount it noexec.
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,exec
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    ulimits:
      core: 0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYNEST_DB_HOST: postgres
      KEYNEST_DB_PORT: 5432
      KEYNEST_DB_NAME: keynest
      KEYNEST_DB_USER: keynest
      KEYNEST_DB_PASSWORD: keynest
      KEYNEST_VAULT_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      KEYNEST_VAULT_KEY_ID: vault-v1
      # Explicit local-only opt-in; omit this in deployed environments.
      KEYNEST_ALLOW_DEMO_VAULT_KEY: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keynest_pg:
