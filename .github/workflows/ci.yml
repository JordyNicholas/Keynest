name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_manager_api:
        description: Publish the verified Manager API image to GHCR (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  java:
    name: Maven (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test (bytecode release 21)
        run: mvn -B test

  angular:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/manager-web/package-lock.json

      - name: Install, test and build Manager Web
        working-directory: apps/manager-web
        run: |
          npm ci
          npm run test:ci
          npm run test:build-config

      - name: Preserve public build output for CSP failure diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-csp-build
          path: apps/manager-web/dist/manager-web/browser
          if-no-files-found: ignore
          retention-days: 1

  consumer:
    name: External consumer (Java ${{ matrix.java }})
    needs: java
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install only the public library artifacts
        run: mvn -B -pl libs/keynest-seal,libs/keynest-policy,libs/keynest-generate -am install -DskipTests
      - name: Verify the standalone consumer and dependency boundary
        run: mvn -B -f examples/external-consumer/pom.xml verify

  compose:
    name: Packaged Compose smoke
    needs: [java, angular]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: keynest-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and start disposable API and PostgreSQL
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Exercise packaged API over HTTP
        run: |
          python3 scripts/check-container-runtime.py
          python3 scripts/compose-smoke.py --disposable

      - name: Report only sanitized startup failure categories
        if: failure()
        run: python3 scripts/check-container-runtime.py --diagnostics

      - name: Remove only this disposable CI project and its data
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans

  hosted-compose:
    name: Hosted Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: keynest-hosted-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KEYNEST_API_IMAGE: keynest-manager-api:ci
      KEYNEST_API_PORT: "8080"
      KEYNEST_CORS_ALLOWED_ORIGINS: https://keynest-test.example.invalid
      KEYNEST_VAULT_KEY_ID: ci-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set disposable database and vault credentials
        run: |
          for name in KEYNEST_DB_PASSWORD KEYNEST_VAULT_KEY_HEX; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Build and start the deployable Manager API
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f deploy/Dockerfile.api -t "$KEYNEST_API_IMAGE" .
          docker compose -f deploy/docker-compose.hosted.yml pull postgres
          docker compose -f deploy/docker-compose.hosted.yml up --pull never -d

      - name: Verify hosted runtime and browser preflight
        run: |
          python3 scripts/check-container-runtime.py --compose-file deploy/docker-compose.hosted.yml
          python3 scripts/compose-smoke.py --disposable --cors-origin "$KEYNEST_CORS_ALLOWED_ORIGINS"
          postgres="$(docker compose -f deploy/docker-compose.hosted.yml ps -q postgres)"
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$postgres")" = 0

      - name: Report only sanitized startup failure categories
        if: failure()
        run: python3 scripts/check-container-runtime.py --compose-file deploy/docker-compose.hosted.yml --diagnostics

      - name: Save the exact verified image for publication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_manager_api
        run: docker save "$KEYNEST_API_IMAGE" | gzip > "${RUNNER_TEMP}/manager-api.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_manager_api
        with:
          name: manager-api-image
          path: ${{ runner.temp }}/manager-api.tar.gz
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Remove only the disposable hosted test project and its data
        if: always()
        run: docker compose -f deploy/docker-compose.hosted.yml down --volumes --remove-orphans

  publish-manager-api:
    name: Publish verified Manager API image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_manager_api
    needs: [consumer, compose, hosted-compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manager-api-image
          path: ${{ runner.temp }}

      - name: Push the tested image and record its immutable reference
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/manager-api:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker load --input "$RUNNER_TEMP/manager-api.tar.gz"
          docker tag keynest-manager-api:ci "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker pull "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'Manager API for commit `%s`\n\n`%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
