name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    name: Maven (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test (bytecode release 21)
        run: mvn -B test

  angular:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/manager-web/package-lock.json

      - name: Install, test and build Manager Web
        working-directory: apps/manager-web
        run: |
          npm ci
          npm run test:ci
          npm run test:build-config

  compose:
    name: Packaged Compose smoke
    needs: [java, angular]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: keynest-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and start disposable API and PostgreSQL
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Exercise packaged API over HTTP
        run: |
          python3 scripts/check-container-runtime.py
          python3 scripts/compose-smoke.py --disposable

      - name: Report only sanitized startup failure categories
        if: failure()
        run: python3 scripts/check-container-runtime.py --diagnostics

      - name: Remove only this disposable CI project and its data
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
